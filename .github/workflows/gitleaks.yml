name: gitleaks

# No paths-ignore, deliberately. A secret can be committed into any file, so
# there is no path this scan may safely skip.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Named for the tool rather than the template's `scan`, which trufflehog.yml
  # would also use. A reusable workflow's rollup rows are `<caller job>/<inner
  # job>`, so two callers both named `scan` produce two identical
  # `scan / Validate inputs` rows: an ambiguous row in a pull request's check
  # rollup and an ambiguous target for any branch protection rule. fosforo
  # observed exactly that and renamed its jobs.
  gitleaks:
    uses: cboone/gh-actions/.github/workflows/scan-for-secrets.yml@0d53592f40b487f01b26b374e539c517fa9c570f # v3.2.0
    with:
      tool: gitleaks
      # Carried from fosforo, which measured 24s max over 29 runs on a
      # repository of comparable size. Not yet measured here; re-measure from
      # this repository's own runs and record the figure in
      # docs/notes/ci-workflows.md.
      #
      # An input rather than a job key, because the job belongs to the reusable
      # workflow, whose own default is 15. Since v3.2.0 it bounds that
      # workflow's `Validate inputs` job as well (cboone/gh-actions#81).
      timeout-minutes:  3
