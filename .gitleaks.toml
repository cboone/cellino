[extend]
# Use the default gitleaks rules as a base.
useDefault = true

[allowlist]
# Paths to exclude from scanning. package-lock.json is deliberately absent:
# it pins the text lint tools and is scanned like any other file.
paths = [
  # Zig pins dependencies by multihash. Those literals look enough like
  # high-entropy credentials to trip the generic rules, and they are
  # deliberately public. The file arrives with the build skeleton in Phase 1;
  # the entry is written now because this allowlist is authored once and the
  # reason is already known. Anchored to the repository root, because an
  # unanchored pattern suppresses every path containing the name: measured
  # with gitleaks 8.30.1 on 2026-09-14, it skipped a planted key in
  # docs/build.zig.zon, and the anchored form still flagged it.
  '''^build\.zig\.zon$''',

  # CMake and Zig build outputs, including fetched third-party trees.
  '''^build/''',
  '''^zig-out/''',
  '''^zig-pkg/''',

  # Committed CC0 reference cuts and rendered oracle vectors, from Phase 2.
  # Both are floating-point sample data, so high-entropy byte runs are expected
  # and mean nothing; this follows audio-tools' exclusion of its 32-bit float
  # probe WAVs. Measured with gitleaks 8.30.1 on 2026-09-14: gitleaks reports
  # these paths without a leading `./`, in both the working-tree and the
  # git-history scans, so the anchor matches, and nothing in the default
  # rules already excludes `.wav`.
  '''^fixtures/.*\.(wav|npz)$''',
]
