[extend]
# Use the default gitleaks rules as a base.
useDefault = true

[allowlist]
# Paths to exclude from scanning. Two files are deliberately absent.
#
# package-lock.json pins the text lint tools and is scanned like any other
# file.
#
# build.zig.zon, the Zig manifest arriving in Phase 1, is scanned too. Its
# dependency multihashes looked like a reason to exclude it, as fosforo and
# springer do, but measured with gitleaks 8.30.1 on 2026-09-14, three real Zig
# manifests (fosforo's, carrying both 0.16-style package hashes, seine's and
# strength's) produced no finding with no allowlist at all. A path entry would
# suppress nothing today while hiding every other line of the manifest from
# the only secret check here that can fail. If a manifest is ever flagged, add
# the specific value under `regexes`, with the finding as the reason, rather
# than excluding the file.
paths = [
  # CMake and Zig build outputs, including fetched third-party trees.
  '''^build/''',
  '''^zig-out/''',
  '''^zig-pkg/''',

  # Committed CC0 reference cuts and rendered oracle vectors, from Phase 2.
  # Both are floating-point sample data, so high-entropy byte runs are expected
  # and mean nothing; this follows audio-tools' exclusion of its 32-bit float
  # probe WAVs. Measured with gitleaks 8.30.1 on 2026-09-14: gitleaks reports
  # these paths without a leading `./`, in both the working-tree and the
  # git-history scans, so the anchor matches, and nothing in the default
  # rules already excludes `.wav`.
  '''^fixtures/.*\.(wav|npz)$''',
]
